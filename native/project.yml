# Upside — native iPhone app (SwiftUI).
# The Xcode project is generated from this file by XcodeGen:
#   brew install xcodegen && cd native && xcodegen
name: Upside
options:
  bundleIdPrefix: com.tejadar1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.32"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Upside:
    type: application
    platform: iOS
    sources:
      - path: Upside
    info:
      path: Upside/Info.plist
      properties:
        CFBundleDisplayName: Upside
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Unlock your budget with Face ID.
        # Lets iCloud share links ("Ron invited you to Upside budget") open Upside.
        CKSharingSupported: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.tejadar1.upside.refresh
        LSApplicationQueriesSchemes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tejadar1.upside
        CODE_SIGN_ENTITLEMENTS: Upside/Upside.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
  UpsideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UpsideTests
    dependencies:
      - target: Upside
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Upside:
    build:
      targets:
        Upside: all
        UpsideTests: [test]
    test:
      targets:
        - UpsideTests
