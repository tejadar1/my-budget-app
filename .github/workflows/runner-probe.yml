name: Runner probe

# Which Mac runners are free right now, and which Xcode they have.
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Every Xcode and its iOS SDK
        run: |
          sw_vers -productVersion; uname -m
          echo "Default: $(xcode-select -p)"
          for x in /Applications/Xcode*.app; do
            v=$("$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1)
            sdk=$("$x/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null | grep -o 'iphoneos[0-9.]*' | head -1)
            echo "$x  →  $v  ·  $sdk"
          done
