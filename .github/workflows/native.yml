name: Native app

# The SwiftUI version of Upside (native/). Every push runs the unit tests,
# builds for the iPhone simulator and screenshots each screen in light and
# dark mode (published to the previews-native branch). TestFlight uploads
# come later, once the native app replaces the current one.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native/**
      - .github/workflows/native.yml

concurrency:
  group: native
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-preview:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        working-directory: native
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                      | select(.name | test("^iPhone [0-9]+ Pro$"))] | last | .udid')
          NAME=$(xcrun simctl list devices available -j | jq -r --arg u "$UDID" '.devices[][] | select(.udid==$u) | .name')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $NAME ($UDID)"

      - name: Unit tests
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild test -project Upside.xcodeproj -scheme Upside \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee "$RUNNER_TEMP/test.log" | grep -E "error:|warning: unre|Test Case.*(passed|failed)|\*\* TEST" || true
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/test.log"; then
            grep -E "error:|failed" "$RUNNER_TEMP/test.log" | sort -u | head -20 \
              | while IFS= read -r line; do echo "::error title=Swift::${line:0:900}"; done
            exit 1
          fi

      - name: Screenshot every tab, light and dark
        working-directory: native
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'Upside.app' | head -1)
          OUT="$RUNNER_TEMP/previews"
          mkdir -p "$OUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          shot() { # mode name args...
            local mode=$1 name=$2; shift 2
            xcrun simctl ui "$UDID" appearance "$mode"
            xcrun simctl terminate "$UDID" com.tejadar1.upside 2>/dev/null || true
            xcrun simctl launch "$UDID" com.tejadar1.upside "$@" > /dev/null
            sleep 4
            xcrun simctl io "$UDID" screenshot "$OUT/$mode-$name.png" > /dev/null
            echo "saved $mode-$name.png"
          }
          for mode in light dark; do
            shot $mode 1-budget -demo -tab budget
            shot $mode 2-accounts -demo -tab accounts
            shot $mode 3-settings -demo -tab settings
            shot $mode 4-category -demo -tab budget -open category:groceries
            shot $mode 5-review -demo -tab budget -open review
            shot $mode 6-trip -demo -tab budget -open trip:miami
            shot $mode 7-limits -demo -tab budget -open limits
            shot $mode 7h-limit-detail -demo -tab budget -open limit:dining
            shot $mode 7g-recommended -demo -tab budget -open recommended
            shot $mode 7b-save -demo -tab budget -open save
            shot $mode 7c-recap -demo -tab budget -open recap
            shot $mode 7d-purchase -demo -tab budget -open purchase:dining
            shot $mode 7e-bills -demo -tab budget -open bills
            shot $mode 7f-search -demo -tab budget -open search:amazon
            shot $mode 8-account -demo -tab accounts -open account:ron-card
            shot $mode 8b-reorder -demo -tab accounts -open reorder
            shot $mode 9-first-run -tab budget
          done
          echo "Built from ${GITHUB_SHA}" > "$OUT/COMMIT.txt"

      - name: Publish screenshots to the previews-native branch
        if: always()
        run: |
          OUT="$RUNNER_TEMP/previews"
          [ -d "$OUT" ] || exit 0
          cp "$RUNNER_TEMP/test.log" "$OUT/test.log" 2>/dev/null || true
          cd "$OUT"
          git init -q -b previews-native
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Native previews for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" previews-native

  # Uploads the native app to TestFlight (same app as before, new build).
  # Runs on "Run workflow" or a commit message containing [ship-native].
  ship:
    needs: test-and-preview
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ship-native]')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      build: ${{ steps.number.outputs.build }}
    steps:
      - name: Pick the build number
        id: number
        run: echo "build=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Check Apple secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$P8" ]; then
            echo "::error::Apple secrets are missing (see docs/SETUP.md step 4)."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        working-directory: native
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive, sign and upload to TestFlight
        working-directory: native
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.number.outputs.build }}
        run: |
          AUTH=(-authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          build() {
            # Archive unsigned, then let the export sign it for the App Store
            # (no registered device needed).
            xcodebuild -project Upside.xcodeproj -scheme Upside -configuration Release \
              -destination generic/platform=iOS -archivePath build/Upside.xcarchive \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              archive
            xcodebuild -exportArchive -archivePath build/Upside.xcarchive \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath build/export -allowProvisioningUpdates "${AUTH[@]}"
          }
          if ! build 2>&1 | tee "$RUNNER_TEMP/ship.log"; then
            grep -E 'error:|\*\* (ARCHIVE|EXPORT) FAILED|Error Domain|[Pp]rovisioning|[Pp]ermission' "$RUNNER_TEMP/ship.log" \
              | sort -u | head -12 | while IFS= read -r line; do echo "::error title=Xcode::${line:0:900}"; done
            exit 1
          fi

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # Puts the newest section of native/RELEASE_NOTES.md into TestFlight's
  # "What to Test" once Apple has processed the build.
  release-notes:
    needs: ship
    uses: ./.github/workflows/testflight-notes.yml
    with:
      build: ${{ needs.ship.outputs.build }}
    secrets: inherit
