name: Build iPhone app

# Builds the app from Actual's source (pinned in app.config), signs it with
# your Apple Developer account and uploads it to TestFlight.
# Secrets are listed in docs/SETUP.md.

on:
  # "Run workflow" button on the Actions tab.
  workflow_dispatch:
  # Rebuild when the app itself changes (not for README edits).
  push:
    branches: [main]
    paths:
      - app.config
      - patches/**
      - overrides/**
      - scripts/**
      - .github/workflows/ios.yml

concurrency:
  group: ios
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap Linux check that Actual downloads and all patches still apply.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Actual source
        run: scripts/prepare.sh

  build:
    needs: check
    runs-on: macos-latest
    # Includes time for Apple to accept the upload.
    timeout-minutes: 90
    steps:
      # Stop right away (instead of after ~15 paid macOS minutes) until
      # docs/SETUP.md step 4 is done.
      - name: Check Apple secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$P8" ]; then
            echo "::error::Apple secrets are missing. Follow docs/SETUP.md step 4, then run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare Actual source
        run: scripts/prepare.sh

      - uses: actions/setup-node@v6
        with:
          node-version-file: actual/.nvmrc

      - name: Install dependencies
        working-directory: actual
        run: |
          corepack enable
          yarn --immutable

      # Build before any signing material lands on the runner.
      - name: Build web app
        working-directory: actual
        run: yarn build:browser --skip-translations

      - name: Import signing certificate (optional)
        env:
          P12_BASE64: ${{ secrets.APPLE_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "No certificate secret set; relying on Apple cloud signing."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Write App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and upload to TestFlight
        working-directory: actual
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          export XCODEBUILD_AUTH_ARGS="-authenticationKeyPath $RUNNER_TEMP/AuthKey.p8 -authenticationKeyID $API_KEY_ID -authenticationKeyIssuerID $API_ISSUER_ID"
          set -o pipefail
          if ! yarn workspace mobile-client build:ipa 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"; then
            # Surface the real errors as annotations (visible on the run page).
            grep -E 'error:|\*\* (ARCHIVE|EXPORT) FAILED|No profiles|No signing certificate|Provisioning profile|not available|Error Domain' "$RUNNER_TEMP/xcodebuild.log" \
              | grep -v 'warning:' | sort -u | head -12 \
              | while IFS= read -r line; do echo "::error title=Xcode::${line:0:900}"; done
            exit 1
          fi

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/signing.p12"

      - name: Summary
        run: |
          PLIST=actual/packages/mobile-client/build/App.xcarchive/Products/Applications/App.app/Info.plist
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          {
            echo "## Uploaded to TestFlight"
            echo
            echo "Version **$VERSION** (build $BUILD). It shows up in the TestFlight app"
            echo "on your iPhone once Apple finishes processing (usually 5-30 minutes)."
          } >> "$GITHUB_STEP_SUMMARY"
